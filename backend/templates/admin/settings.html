<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSCO Settings</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fb; color: #1f2937; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: #111827; color: white; padding: 24px 20px; }
    .sidebar h2 { margin-top: 0; }
    .sidebar a { display: block; color: #d1d5db; text-decoration: none; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; }
    .sidebar a.active, .sidebar a:hover { background: #1f2937; color: white; }
    .main { flex: 1; padding: 24px; }
    .panel { background: white; padding: 18px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, textarea, button { padding: 10px; border-radius: 10px; border: 1px solid #d1d5db; }
    button { background: #8B0000; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>TSCO Admin</h2>
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/donations">Donations</a>
      <a href="/admin/blogs">Blogs</a>
      <a href="/admin/newsletters">Newsletters</a>
      <a href="/admin/gallery">Gallery</a>
      <a href="/admin/events">Events</a>
      <a href="/admin/volunteers">Volunteers</a>
      <a href="/admin/messages">Contact Messages</a>
      <a href="/admin/reports">Reports</a>
      <a href="/admin/users">Users</a>
      <a class="active" href="/admin/settings">Settings</a>
      <a class="logout" href="/admin/logout">Logout</a>
    </aside>
    <main class="main">
      <h1>Website Settings</h1>
      <div class="panel">
        <form method="post">
          <input type="text" name="org_name" placeholder="Organization Name" value="{{ settings.org_name or '' }}" />
          <textarea name="mission" rows="4" placeholder="Mission">{{ settings.mission or '' }}</textarea>
          <textarea name="vision" rows="4" placeholder="Vision">{{ settings.vision or '' }}</textarea>
          <input type="text" name="contact_email" placeholder="Contact Email" value="{{ settings.contact_email or '' }}" />
          <input type="text" name="phone" placeholder="Phone" value="{{ settings.phone or '' }}" />
          <input type="text" name="bank_details" placeholder="Bank Details" value="{{ settings.bank_details or '' }}" />
          <input type="text" name="mpesa_info" placeholder="M-Pesa Info" value="{{ settings.mpesa_info or '' }}" />
          <button type="submit">Save Settings</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>

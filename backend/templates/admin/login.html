<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSCO Admin Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 0; }
    .container { max-width: 420px; margin: 80px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; color: #8B0000; }
    form { display: flex; flex-direction: column; gap: 14px; }
    input, button { padding: 12px; border-radius: 10px; border: 1px solid #d8dce6; font-size: 14px; }
    button { background: #8B0000; color: white; cursor: pointer; border: none; }
    .message { margin-top: 12px; color: #b91c1c; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TSCO Admin Portal</h1>
    <p>Secure sign in to manage donations, blogs, events, and more.</p>
    <form method="post">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    {% if error %}<div class="message">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
